<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34373f"/>
      <stop offset="1" stop-color="#121317"/>
    </linearGradient>
    <linearGradient id="sky" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#5aa2f0"/>
      <stop offset="1" stop-color="#2463c4"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.09"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- app tile -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#sheen)"/>
  <rect x="65.5" y="65.5" width="893" height="893" rx="198.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- clock -->
  <rect x="200" y="200" width="292" height="292" rx="64" fill="url(#glass)"/>
  <circle cx="346" cy="346" r="92" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="10"/>
  <line x1="346" y1="346" x2="346" y2="284" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
  <line x1="346" y1="346" x2="392" y2="368" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
  <circle cx="346" cy="346" r="13" fill="#0a84ff"/>

  <!-- weather -->
  <rect x="532" y="200" width="292" height="292" rx="64" fill="url(#sky)"/>
  <circle cx="634" cy="306" r="46" fill="#ffd54a"/>
  <rect x="640" y="318" width="132" height="66" rx="33" fill="#ffffff" fill-opacity="0.95"/>
  <circle cx="694" cy="322" r="40" fill="#ffffff" fill-opacity="0.95"/>

  <!-- agenda -->
  <rect x="200" y="532" width="624" height="292" rx="64" fill="url(#glass)"/>
  <rect x="252" y="590" width="14" height="72" rx="7" fill="#ff9f0a"/>
  <rect x="292" y="596" width="300" height="26" rx="13" fill="#ffffff" fill-opacity="0.92"/>
  <rect x="292" y="636" width="190" height="20" rx="10" fill="#ffffff" fill-opacity="0.38"/>
  <rect x="252" y="696" width="14" height="72" rx="7" fill="#ff453a"/>
  <rect x="292" y="702" width="236" height="26" rx="13" fill="#ffffff" fill-opacity="0.92"/>
  <rect x="292" y="742" width="150" height="20" rx="10" fill="#ffffff" fill-opacity="0.38"/>
</svg>
