[package]
name = "hyprwidgets"
version = "0.1.0"
description = "Interactive desktop widgets for Hyprland"
license = "MIT"
edition = "2024"

[dependencies]
async-channel = "2.5.0"
chrono = "0.4.45"
chrono-tz = "0.10.4"
dirs = "7.0.0"
gtk4 = { version = "0.11.5", features = ["v4_14"] }
gtk4-layer-shell = "0.8"
iana-time-zone = "0.1.65"
ical = "0.11.0"
rrule = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
ureq = "3.5.1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
