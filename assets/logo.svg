<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cool" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#89b4fa"/>
      <stop offset=".55" stop-color="#b4befe"/>
      <stop offset="1" stop-color="#cba6f7"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0e0e14"/>
  <!-- a tall card with zunder's caret -->
  <rect x="11" y="11" width="19" height="42" rx="5" fill="url(#cool)"/>
  <polyline points="17,26 24,32 17,38" fill="none" stroke="#0e0e14" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- a filled small card -->
  <rect x="34" y="11" width="19" height="19" rx="5" fill="url(#cool)" fill-opacity=".55"/>
  <!-- an outlined card with a "Title ───" heading -->
  <rect x="35" y="35" width="17" height="17" rx="4.5" fill="#1b1b27" stroke="#45475a" stroke-width="2"/>
  <line x1="39" y1="41" x2="42.5" y2="41" stroke="#b4befe" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="45.5" y1="41" x2="48" y2="41" stroke="#45475a" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="39" y1="46.5" x2="46" y2="46.5" stroke="#5a5a6a" stroke-width="1.6" stroke-linecap="round"/>
</svg>
